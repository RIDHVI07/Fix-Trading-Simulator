# ─────────────────────────────────────────────────────────────
#  FIX Trading Simulator — Application Configuration
# ─────────────────────────────────────────────────────────────

# HTTP Server
server.port=8080

# ─────────────────────────────────────────────────────────────
#  FIX Session Configuration
#  Override fix.initiator.host=exchange when running in Docker
# ─────────────────────────────────────────────────────────────
fix.acceptor.port=9878
fix.initiator.host=localhost
fix.fill.delay.seconds=2

# ─────────────────────────────────────────────────────────────
#  Springdoc / Swagger UI
# ─────────────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ─────────────────────────────────────────────────────────────
#  Actuator
# ─────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=FIX Trading Simulator
info.app.version=1.0.0

# ─────────────────────────────────────────────────────────────
#  Logging
# ─────────────────────────────────────────────────────────────
logging.level.com.trading.simulator=INFO
logging.level.quickfix=WARN
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
