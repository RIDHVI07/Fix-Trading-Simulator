# ─────────────────────────────────────────────────────────────
#  FIX Trading Simulator — Application Configuration
# ─────────────────────────────────────────────────────────────

# HTTP Server
server.port=8080

# ─────────────────────────────────────────────────────────────
#  FIX Session Configuration
#  Override fix.initiator.host=exchange when running in Docker
# ─────────────────────────────────────────────────────────────
fix.acceptor.port=9878
fix.initiator.host=localhost
fix.fill.delay.seconds=2

# ─────────────────────────────────────────────────────────────
#  Logging
# ─────────────────────────────────────────────────────────────
logging.level.com.trading.simulator=INFO
logging.level.quickfix=WARN
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
